name: Deploy to Firebase (Functions + Hosting)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Verify required secrets are set
        run: |
          missing=()
          [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_WHOWE_2026 }}" ] && missing+=("FIREBASE_SERVICE_ACCOUNT_WHOWE_2026")
          [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ] && missing+=("FIREBASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}. Set them in Settings > Secrets and variables > Actions before deploying."
            exit 1
          fi

      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy Functions to Firebase
        run: |
          printf '%s' "$FIREBASE_SA_KEY" > /tmp/firebase-service-account.json
          npx firebase-tools@latest deploy --only functions --project "$FIREBASE_PROJECT_ID_VALUE" --non-interactive
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WHOWE_2026 }}
          FIREBASE_PROJECT_ID_VALUE: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json

      - name: Deploy Hosting to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WHOWE_2026 }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
